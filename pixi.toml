[workspace]
authors = [
    "Prince Ravi Leow <prince.ravi.leow@sund.ku.dk>",
    "Neil Scheidwasser <neil.clow@sund.ku.dk>",
    "David Duchêne <david.duchene@sund.ku.dk>",
]
channels = ["conda-forge"]
platforms = ["linux-64"]
name = "PlayClass"
version = "1.0.1"

[system-requirements]
cuda = "12"

[environments]
default = { solve-group = "default" }
tracker = { features = ["tracker"], solve-group = "default" }
gs2 = { features = ["gs2"], solve-group = "default" }
videoprism = { features = ["videoprism"], solve-group = "videoprism" }
ci = { features = ["ci"], no-default-feature = true, solve-group = "ci" }

[tasks]
# Setup
setup_vjepa2 = "bash scripts/setup_vjepa2.1.sh"
# Tracking
track_best = "python -m pipeline.run_tracker"
track_all = "bash pipeline/run_tracker_all.sh"
track_yolo = "bash pipeline/run_tracker_all.sh yolo"
track_sam3 = "bash pipeline/run_tracker_all.sh sam3"
track_gs2 = "bash pipeline/run_tracker_all.sh gs2"
eval_all = "bash pipeline/run_tracker_all.sh --eval"
eval_yolo = "bash pipeline/run_tracker_all.sh yolo --eval"
eval_sam3 = "bash pipeline/run_tracker_all.sh sam3 --eval"
eval_gs2 = "bash pipeline/run_tracker_all.sh gs2 --eval"
score_tracker = "python -m pipeline.eval_tracker_all score"
prepare_tracker = "python -m pipeline.eval_tracker_all prepare"
viz_tracking = "python -m pipeline.viz_tracking"
# Embedding extraction
extract_dinov3 = "python -m pipeline.extract_embeddings_dinov3"
extract_vjepa2 = "python -m pipeline.extract_embeddings_vjepa2"
# Feature extraction
build_dataset = "python -m pipeline.build_dataset"
extract_features = "python -m pipeline.extract_features"
# Clustering
clustering_grid = "python -m pipeline.clustering_grid"
# Classification
train = "python -m pipeline.train"
train_sweep_k = "bash pipeline/train_sweep_k.sh"
train_ablate_best = "bash pipeline/train_ablate_best.sh"
eval_classification = "python -m pipeline.eval_classification"
# Testing
test_features = "python -m pytest tests/test_features.py -v"
test_labels = "python -m pytest tests/test_labels.py -v"
check_dataset_integrity = "python -m tests.check_dataset_integrity"
test_dataset_integrity = "python -m pytest tests/test_dataset_integrity.py -v"
test_pooling = "python -m pytest tests/test_pooling.py -v"
test_val_rotation = "python -m pytest tests/test_val_rotation.py -v"
check_crop_modes = "python -m tests.check_crop_modes"

[dependencies]
python = ">=3.11,<3.12"
pytest = ">=9.0.2,<10"
packaging = ">=20,<26.3"
pre-commit = ">=4.6.2,<5"
filelock = ">=3.16"

[pypi-dependencies]
ipykernel = ">=7.1.0"
ipywidgets = ">=8.1.8"
seaborn = ">=0.13.2"
shap = ">=0.51.0, <0.52"
simpler-timer = ">=0.0.2"
transformers = { git = "https://github.com/huggingface/transformers", rev = "v5.0.0rc2" }
accelerate = ">=1.12.0"
numpy = ">=2"
loguru = ">=0.7.3"
matplotlib = ">=3.7.0,<4"
pandas = ">=3.0.0,<4"
pillow = ">=12.1.0,<13"
pyarrow = ">=23.0.0,<24"
pycocotools = ">=2.0.11,<3"
opencv-python = ">=4.11.0.86, <5"
openpyxl = ">=3.1.0,<4"
scikit-learn = ">=1.7.0"
supervision = ">=0.27.0,<0.28"
torchcodec = "==0.9"
torch = "==2.9.1+cu126"
torchvision = "==0.24.1+cu126"
lightning = ">=2.5"
kmedoids = ">=0.5.5,<0.6"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu126"]

[feature.gs2.pypi-dependencies]
setuptools = "*"

[feature.gs2.tasks]
setup_gs2 = "bash scripts/setup_gs2.sh"

[feature.tracker.pypi-dependencies]
omegaconf = ">=2.3.0"
simpler-timer = ">=0.0.2"
motmetrics = ">=1.4.0"
ultralytics = "==8.4.23"

[feature.tracker.tasks]
compute_chunk_boundaries = "python -m pipeline.compute_chunk_boundaries"
test_tracker = "CUDA_VISIBLE_DEVICES=0 python -m pytest tests/test_tracker.py -v"
test_tracking_postprocessing = "python -m pytest tests/test_tracking_postprocessing.py -v"

[feature.ci.dependencies]
python = ">=3.11,<3.12"
pytest = ">=9.0.2,<10"

[feature.ci.pypi-dependencies]
numpy = ">=2"
loguru = ">=0.7.3"
matplotlib = ">=3.7.0,<4"
pandas = ">=3.0.0,<4"
psutil = ">=5"
pyarrow = ">=23.0.0,<24"
pycocotools = ">=2.0.11,<3"
opencv-python = ">=4.11.0.86, <5"
openpyxl = ">=3.1.0,<4"
scikit-learn = ">=1.7.0"
pillow = ">=12.1.0,<13"
tqdm = ">=4"

[feature.ci.tasks]
test = "python -m pytest tests/ --ignore=tests/test_tracker.py --ignore=tests/test_pooling.py -v"

[feature.videoprism.target.linux-64.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }
opt-einsum = ">=3.3,<3.4"
videoprism = { git = "https://github.com/google-deepmind/videoprism" }
einshape = ">=1.0"
mediapy = ">=1.2.0"
pillow = ">=12.1.0,<13"
opencv-python-headless = ">=4.10"

[feature.videoprism.tasks]
extract_videoprism = "python -m pipeline.extract_embeddings_videoprism"
